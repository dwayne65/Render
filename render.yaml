services:
  - type: web
    name: campus-lost-found
    runtime: node
    plan: free
    rootDir: campus-lost-found
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
