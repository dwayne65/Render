<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Bugema Lost & Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrap">
        <nav>
          <div class="brand"><div class="brand-mark">B</div><span>Bugema Lost & Found</span></div>
          <div class="nav-links" data-role-nav>
            <a href="./index.html">Home</a>
            <a href="./login.html">Login</a>
          </div>
        </nav>
      </div>
    </header>

    <main class="container section">
      <div class="auth-card">
        <h2>Create your student account</h2>
        <p class="muted">Register to report lost items, claim found belongings, and track updates.</p>
        <form id="registerForm">
          <div class="form-group">
            <label for="fullName">Full name</label>
            <input id="fullName" type="text" required />
          </div>
          <div class="form-group">
            <label for="studentId">Student ID</label>
            <input id="studentId" type="text" placeholder="2024/BCS/202" required />
          </div>
          <div class="form-group">
            <label for="email">University email</label>
            <input id="email" type="email" required />
          </div>
          <div class="form-group">
            <label for="phone">Phone number</label>
            <input id="phone" type="tel" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input id="password" type="password" required />
              <button type="button" data-password-toggle>Show</button>
            </div>
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm password</label>
            <div class="password-wrap">
              <input id="confirmPassword" type="password" required />
              <button type="button" data-password-toggle>Show</button>
            </div>
          </div>
          <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 10px;">Register</button>
        </form>
        <p style="margin-top: 20px; text-align: center;">Already have an account? <a href="./login.html">Login</a></p>
      </div>
    </main>

    <script src="./services/studentService.js"></script>
    <script src="./services/lostItemService.js"></script>
    <script src="./services/foundItemService.js"></script>
    <script src="./services/claimService.js"></script>
    <script src="./services/notificationService.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
