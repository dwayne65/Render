<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Reports | Bugema Lost & Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="page-shell"><aside class="sidebar"><div class="brand" style="padding-left: 8px;"><div class="brand-mark">B</div><span>Bugema</span></div><div class="nav-links" data-role-nav></div></aside><main class="content"><div class="section-head"><h2>My reports</h2><p>Track your lost and found records.</p></div><div id="reportList" class="item-grid"></div></main></div>
    <script src="../services/studentService.js"></script>
    <script src="../services/lostItemService.js"></script>
    <script src="../services/foundItemService.js"></script>
    <script src="../services/claimService.js"></script>
    <script src="../services/notificationService.js"></script>
    <script src="../js/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async function () {
        try {
        await window.appReady;
        const state = window.appStore.getState();
        const user = state.students.find((s) => s.id === state.currentUserId);
        if (!user) throw new Error('Please log in to view your reports.');
        const reports = [...(state.lostItems || []).filter((i) => i.reportBy === user.id), ...(state.foundItems || []).filter((i) => i.reportBy === user.id || (i.contact && i.contact.includes(user.email)))];
        const container = document.getElementById('reportList');
        container.innerHTML = reports.length ? reports.map((item) => `
          <article class="card item-card">
            <img src="${escapeHtml(safeImageUrl(item.image))}" alt="${escapeHtml(item.itemName)}" />
            <div class="item-card-body">
              <div class="row-between"><span class="badge badge-primary">${escapeHtml(item.category)}</span><span class="status ${escapeHtml(item.status)}">${escapeHtml(item.status)}</span></div>
              <h4>${escapeHtml(item.itemName)}</h4>
              <p>${escapeHtml(item.description)}</p>
              <ul><li><i class="fa-solid fa-location-dot"></i> ${escapeHtml(item.location)}</li><li><i class="fa-solid fa-calendar"></i> ${new Date(item.dateLost || item.dateFound).toLocaleDateString()}</li></ul>
            </div>
          </article>
        `).join('') : '<p class="empty-state">No reports found.</p>';
        } catch (error) {
          showToast(error.message, 'error');
        }
      });
    </script>
  </body>
</html>
