<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Found Items | Bugema Lost & Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header class="topbar"><div class="container"><nav><div class="brand"><div class="brand-mark">B</div><span>Bugema Lost & Found</span></div><div class="nav-links" data-role-nav></div></nav></div></header>
    <main class="container section">
      <div class="section-head row-between">
        <div><h2>Found items</h2><p>Review reported belongings and submit a claim if you think it is yours.</p></div>
        <a class="btn btn-primary" href="./report-found.html">Report found item</a>
      </div>
      <div class="row" style="margin-bottom: 24px; gap: 12px; flex-wrap: wrap;">
        <input id="foundSearch" type="text" placeholder="Search by item name" style="max-width: 260px;" />
        <select id="foundCategory" style="max-width: 200px;"><option value="">All categories</option></select>
        <select id="foundLocation" style="max-width: 200px;"><option value="">All locations</option></select>
        <button class="btn btn-secondary" id="applyFoundFilters">Apply filters</button>
      </div>
      <div id="foundItemsContainer" class="item-grid"></div>
    </main>
    <script src="../services/studentService.js"></script>
    <script src="../services/lostItemService.js"></script>
    <script src="../services/foundItemService.js"></script>
    <script src="../services/claimService.js"></script>
    <script src="../services/notificationService.js"></script>
    <script src="../js/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async function () {
        try {
        await window.appReady;
        const state = window.appStore.getState();
        const items = state.foundItems || [];
        const container = document.getElementById('foundItemsContainer');
        const categorySelect = document.getElementById('foundCategory');
        const locationSelect = document.getElementById('foundLocation');
        const populateSelect = () => {
          const categories = [...new Set(items.map((i) => i.category))];
          const locations = [...new Set(items.map((i) => i.location))];
          categorySelect.innerHTML = '<option value="">All categories</option>' + categories.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
          locationSelect.innerHTML = '<option value="">All locations</option>' + locations.map((l) => `<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join('');
        };
        const render = () => {
          const search = document.getElementById('foundSearch').value.toLowerCase();
          const category = categorySelect.value;
          const location = locationSelect.value;
          const filtered = items.filter((item) => {
            const matchesSearch = item.itemName.toLowerCase().includes(search) || item.description.toLowerCase().includes(search);
            const matchesCategory = !category || item.category === category;
            const matchesLocation = !location || item.location === location;
            return matchesSearch && matchesCategory && matchesLocation;
          });
          if (!filtered.length) {
            container.innerHTML = '<p class="empty-state">No found items match your filters.</p>';
            return;
          }
          container.innerHTML = filtered.map((item) => `
            <article class="card item-card">
              <img src="${escapeHtml(safeImageUrl(item.image))}" alt="${escapeHtml(item.itemName)}" />
              <div class="item-card-body">
                <div class="row-between"><span class="badge badge-success">${escapeHtml(item.category)}</span><span class="status ${escapeHtml(item.status)}">${escapeHtml(item.status)}</span></div>
                <h4>${escapeHtml(item.itemName)}</h4>
                <p>${escapeHtml(item.description)}</p>
                <ul>
                  <li><i class="fa-solid fa-location-dot"></i> ${escapeHtml(item.location)}</li>
                  <li><i class="fa-solid fa-calendar"></i> ${new Date(item.dateFound).toLocaleDateString()}</li>
                </ul>
                <div class="action-row"><a href="./item-details.html?id=${encodeURIComponent(item.id)}&type=found" class="btn btn-secondary">View details</a><a href="./submit-claim.html?itemId=${encodeURIComponent(item.id)}" class="btn btn-primary">Claim item</a></div>
              </div>
            </article>
          `).join('');
        };
        populateSelect();
        render();
        document.getElementById('applyFoundFilters').addEventListener('click', render);
        document.getElementById('foundSearch').addEventListener('input', render);
        } catch (error) {
          showToast(error.message, 'error');
        }
      });
    </script>
  </body>
</html>
