<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Bugema Lost & Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand" style="padding-left: 8px;"><div class="brand-mark">B</div><span>Bugema</span></div>
        <div class="nav-links" data-admin-nav></div>
      </aside>
      <main class="content">
        <div class="row-between" style="margin-bottom: 28px;"><div><h1 style="margin: 0 0 8px;">Administration dashboard</h1><p class="muted">Overview of lost items, found items and claims.</p></div><a href="./manage-claims.html" class="btn btn-primary">Review claims</a></div>
        <section class="stats-grid" style="margin-bottom: 22px;">
          <div class="card stat-card"><p>Total lost items</p><h3 id="totalLostItems">0</h3></div>
          <div class="card stat-card"><p>Total found items</p><h3 id="totalFoundItems">0</h3></div>
          <div class="card stat-card"><p>Pending claims</p><h3 id="pendingClaims">0</h3></div>
          <div class="card stat-card"><p>Approved claims</p><h3 id="approvedClaims">0</h3></div>
          <div class="card stat-card"><p>Returned items</p><h3 id="returnedItems">0</h3></div>
          <div class="card stat-card"><p>Registered students</p><h3 id="registeredStudents">0</h3></div>
        </section>
        <section class="dashboard-grid">
          <div class="summary-panel"><h3>Recent lost-item reports</h3><div class="list-stack" data-admin-recent-reports></div></div>
          <div class="summary-panel"><h3>Recent claims</h3><div class="list-stack" data-admin-recent-claims></div></div>
        </section>
      </main>
    </div>
    <script src="../services/studentService.js"></script>
    <script src="../services/lostItemService.js"></script>
    <script src="../services/foundItemService.js"></script>
    <script src="../services/claimService.js"></script>
    <script src="../services/notificationService.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
