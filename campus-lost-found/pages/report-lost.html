<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report Lost Item | Bugema Lost & Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header class="topbar"><div class="container"><nav><div class="brand"><div class="brand-mark">B</div><span>Bugema Lost & Found</span></div><div class="nav-links" data-role-nav></div></nav></div></header>
    <main class="container section">
      <div class="form-card">
        <div class="form-utility">
          <div>
            <h2 style="margin: 0;">Report a lost item</h2>
            <p class="muted">Provide clear details to improve the chances of a successful match.</p>
          </div>
          <button class="btn btn-secondary" id="clearLostForm" type="button">Clear form</button>
        </div>
        <form id="lostItemForm">
          <div class="form-grid">
            <div class="form-group"><label>Item name</label><input name="itemName" required /></div>
            <div class="form-group"><label>Category</label><select name="category"><option>Electronics</option><option>Documents and identification cards</option><option>Bags and wallets</option><option>Clothing</option><option>Books and stationery</option><option>Accessories</option><option>Keys</option><option>Other</option></select></div>
            <div class="form-group full"><label>Description</label><textarea name="description" required></textarea></div>
            <div class="form-group"><label>Date lost</label><input name="dateLost" type="date" required /></div>
            <div class="form-group"><label>Location where it was lost</label><input name="location" required /></div>
            <div class="form-group full"><label>Distinguishing features</label><textarea name="features" required></textarea></div>
            <div class="form-group full"><label>Contact information</label><input name="contact" required /></div>
            <div class="form-group full"><label>Item photograph</label><input id="imageUpload" type="file" accept="image/*" /></div>
            <div class="form-group full" style="text-align: center;">
              <img id="imagePreview" src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=900&q=80" alt="Preview" style="max-width: 220px; border-radius: 16px; margin: 0 auto;" />
            </div>
          </div>
          <div class="form-actions"><a href="./lost-items.html" class="btn btn-secondary">Cancel</a><button class="btn btn-primary" type="submit">Submit report</button></div>
        </form>
      </div>
    </main>
    <script src="../services/studentService.js"></script>
    <script src="../services/lostItemService.js"></script>
    <script src="../services/foundItemService.js"></script>
    <script src="../services/claimService.js"></script>
    <script src="../services/notificationService.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
