<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Students | Bugema Lost & Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="page-shell"><aside class="sidebar"><div class="brand" style="padding-left: 8px;"><div class="brand-mark">B</div><span>Bugema</span></div><div class="nav-links" data-admin-nav></div></aside><main class="content"><div class="section-head"><h2>Student management</h2><p>Manage registered students and review records.</p></div><div id="studentTable" class="summary-panel"></div></main></div>
    <script src="../services/studentService.js"></script>
    <script src="../services/lostItemService.js"></script>
    <script src="../services/foundItemService.js"></script>
    <script src="../services/claimService.js"></script>
    <script src="../services/notificationService.js"></script>
    <script src="../js/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        try {
        await window.appReady;
        const students = window.appStore.getState().students || [];
        document.getElementById('studentTable').innerHTML = '<table style="width:100%; border-collapse: collapse;">' + students.map((student) => `
          <tr style="border-bottom:1px solid #e5e7eb;">
            <td style="padding:12px;">${escapeHtml(student.fullName)}</td>
            <td style="padding:12px;">${escapeHtml(student.studentId)}</td>
            <td style="padding:12px;">${escapeHtml(student.email)}</td>
            <td style="padding:12px;">${escapeHtml(student.phone)}</td>
          </tr>`).join('') + '</table>';
        } catch (error) {
          showToast(error.message, 'error');
        }
      });
    </script>
  </body>
</html>
