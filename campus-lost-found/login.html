<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Bugema Lost & Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrap">
        <nav>
          <div class="brand"><div class="brand-mark">B</div><span>Bugema Lost & Found</span></div>
          <div class="nav-links" data-role-nav>
            <a href="./index.html">Home</a>
            <a href="./register.html">Register</a>
          </div>
        </nav>
      </div>
    </header>

    <main class="container section">
      <div class="auth-card">
        <h2>Student login</h2>
        <p class="muted">Sign in with your registered Bugema account.</p>
        <form id="loginForm">
          <div class="form-group">
            <label for="loginEmail">University email</label>
            <input id="loginEmail" name="email" type="email" placeholder="name@student.bugema.ac.ug" required />
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <div class="password-wrap">
              <input id="loginPassword" name="password" type="password" placeholder="Enter your password" required />
              <button type="button" data-password-toggle>Show</button>
            </div>
          </div>
          <div class="row-between" style="margin-top: 14px; margin-bottom: 20px;">
            <label><input type="checkbox" /> Remember me</label>
            <a href="#">Forgot password?</a>
          </div>
          <button class="btn btn-primary" type="submit" style="width: 100%;">Login</button>
        </form>
        <p style="margin-top: 20px; text-align: center;">Need an account? <a href="./register.html">Register here</a></p>
      </div>
    </main>

    <script src="./services/studentService.js"></script>
    <script src="./services/lostItemService.js"></script>
    <script src="./services/foundItemService.js"></script>
    <script src="./services/claimService.js"></script>
    <script src="./services/notificationService.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
